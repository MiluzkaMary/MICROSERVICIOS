server:
  port: ${PORT:8083}

spring:
  application:
    name: servidor-notificaciones
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificaciones_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 5
          multiplier: 2.0

  mail:
    host: ${SMTP_HOST:mailhog}
    port: ${SMTP_PORT:1025}
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: ${JWT_SECRET:secret-key-cambiar-en-produccion}
  smtp:
    from: ${SMTP_FROM:"Sistema RH" <rh@empresa.com>}
  auth:
    service-url: ${AUTH_SERVICE_URL:http://localhost:8084}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs/swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.empresa.notificaciones: INFO
    org.springframework.amqp: WARN
    org.hibernate: WARN
