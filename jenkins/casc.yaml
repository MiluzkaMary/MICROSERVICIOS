jenkins:
  systemMessage: "Jenkins CI — Sistema de Microservicios"
  numExecutors: 4
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin123"
          properties:
            - mailer:
                emailAddress: "admin@empresa.com"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube Token para análisis"
              secret: "${SONAR_TOKEN}"

tool:
  git:
    installations:
      - name: "Default"
        home: "git"

jobs:
  - script: |
      pipelineJob('empleados-ci') {
        displayName('Servidor Empleados — CI Pipeline')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/MiluzkaMary/MICROSERVICIOS.git')
                }
                branches('*/main')
              }
            }
            scriptPath('servidor-empleados/Jenkinsfile')
          }
        }
        triggers {
          pollSCM('H/5 * * * *')
        }
      }
