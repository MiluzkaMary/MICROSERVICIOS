services:
  empleados-service:
    build:
      context: ./servidor-empleados
      dockerfile: Dockerfile
    container_name: empleados-app
    restart: unless-stopped
    environment:
      - PORT=8080
      - DB_HOST=database-empleados
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=empleados_db
      - NODE_ENV=production
      # Configuración JWT
      - JWT_SECRET=${JWT_SECRET}
      # Configuración para comunicación con servicio de departamentos
      - DEPARTAMENTOS_SERVICE_HOST=departamentos-service
      - DEPARTAMENTOS_SERVICE_PORT=8081
      # Configuración RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8080:8080"
    depends_on:
      database-empleados:
        condition: service_healthy
      departamentos-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - microservicios-network

  database-empleados:
    image: postgres:15-alpine
    container_name: empleados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: empleados_db
    ports:
      - "5432:5432"
    volumes:
      - empleados_data:/var/lib/postgresql/data
      - ./servidor-empleados/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./servidor-auth
      dockerfile: Dockerfile
    container_name: auth-app
    restart: unless-stopped
    environment:
      - PORT=8084
      - DB_HOST=database-auth
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=auth_db
      - NODE_ENV=production
      # Configuración JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-24h}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      # Configuración RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8084:8084"
    depends_on:
      database-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservicios-network

  database-auth:
    image: postgres:15-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    ports:
      - "5436:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
      - ./servidor-auth/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  departamentos-service:
    build:
      context: ./servidor-departamentos
      dockerfile: Dockerfile
    container_name: departamentos-app
    restart: unless-stopped
    environment:
      - PORT=8081
      - DB_HOST=database-departamentos
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=departamentos_db
      - PYTHONUNBUFFERED=1
      # Configuración JWT
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      database-departamentos:
        condition: service_healthy
    networks:
      - microservicios-network

  database-departamentos:
    image: postgres:15-alpine
    container_name: departamentos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: departamentos_db
    ports:
      - "5433:5432"
    volumes:
      - departamentos_data:/var/lib/postgresql/data
      - ./servidor-departamentos/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  perfiles-service:
    build:
      context: ./servidor-perfiles
      dockerfile: Dockerfile
    container_name: perfiles-app
    restart: unless-stopped
    environment:
      - PORT=8082
      - DB_HOST=database-perfiles
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=perfiles_db
      - NODE_ENV=production
      # Configuración JWT
      - JWT_SECRET=${JWT_SECRET}
      # Configuración RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8082:8082"
    depends_on:
      database-perfiles:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservicios-network

  database-perfiles:
    image: postgres:15-alpine
    container_name: perfiles-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: perfiles_db
    ports:
      - "5434:5432"
    volumes:
      - perfiles_data:/var/lib/postgresql/data
      - ./servidor-perfiles/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  notificaciones-service:
    build:
      context: ./servidor-notificaciones
      dockerfile: Dockerfile
    container_name: notificaciones-app
    restart: unless-stopped
    environment:
      - PORT=8083
      - DB_HOST=database-notificaciones
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=notificaciones_db
      - NODE_ENV=production
      # Configuración JWT
      - JWT_SECRET=${JWT_SECRET}
      # Configuración SMTP para envío de emails (Mailhog)
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_FROM=${SMTP_FROM}
      # URL del servicio de autenticación (para emails)
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://localhost:8084}
      # Configuración RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8083:8083"
    depends_on:
      database-notificaciones:
        condition: service_healthy
      mailhog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - microservicios-network

  database-notificaciones:
    image: postgres:15-alpine
    container_name: notificaciones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: notificaciones_db
    ports:
      - "5435:5432"
    volumes:
      - notificaciones_data:/var/lib/postgresql/data
      - ./servidor-notificaciones/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ - Message Broker para comunicación asíncrona
  # Management UI: http://localhost:15672 (guest/guest)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # Puerto AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailhog - Servidor SMTP de prueba para desarrollo
  # Interfaz web: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # Puerto SMTP
      - "8025:8025"  # Interfaz web
    networks:
      - microservicios-network

  registry:
    image: registry:2
    container_name: docker-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - microservicios-network

  # Express Gateway - API Gateway
  # Punto de entrada para todas las peticiones externas
  # Valida JWT en rutas protegidas antes de hacer proxy a los microservicios
  gateway-service:
    build:
      context: ./servidor-gateway
      dockerfile: Dockerfile
    container_name: gateway-app
    restart: unless-stopped
    environment:
      - PORT=8085
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8085:8085"
    depends_on:
      - auth-service
      - empleados-service
      - departamentos-service
      - perfiles-service
      - notificaciones-service
    networks:
      - microservicios-network

  bdd-tests:
    build:
      context: ./e2e-tests
      dockerfile: Dockerfile
    depends_on:
      - gateway-service
      - empleados-service
      - auth-service
      - notificaciones-service
      - mailhog
      - rabbitmq
    environment:
      BASE_URL: http://gateway-service:8085
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      USER_EMAIL: ${USER_EMAIL}
      USER_PASSWORD: ${USER_PASSWORD}
      MAILHOG_URL: http://mailhog:8025
    networks:
      - microservicios-network
    profiles:
      - testing

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - sonar-db
    networks:
      - microservicios-network

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - microservicios-network

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    user: root
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs
      - SONAR_TOKEN=${SONAR_TOKEN}
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/casc.yaml
    networks:
      - microservicios-network

networks:
  microservicios-network:
    driver: bridge

volumes:
  empleados_data:
  auth_data:
  departamentos_data:
  perfiles_data:
  notificaciones_data:
  rabbitmq_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:
  registry_data:
