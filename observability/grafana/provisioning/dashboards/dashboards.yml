# Configuración de provisioning de dashboards en Grafana
apiVersion: 1

providers:
  - name: 'Microservicios'
    orgId: 1
    folder: 'Microservicios'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
